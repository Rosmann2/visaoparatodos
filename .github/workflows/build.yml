name: Construir APK
on:
  workflow_dispatch:
  push:
    paths: ['android-app.zip', '.github/workflows/build.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: unzip -q android-app.zip -d projeto
      - name: Corrigir repositorios
        run: |
          echo "repositories { google(); mavenCentral() }" >> projeto/build.gradle
      - run: cd projeto && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VisaoParaTodos-apk
          path: projeto/build/outputs/apk/debug/*.apk
